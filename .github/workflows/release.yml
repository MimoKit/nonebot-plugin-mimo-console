name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          version: latest

      - name: Get version
        id: version
        run: |
          echo "VERSION=$(uv version --short)" >> "$GITHUB_OUTPUT"
          echo "TAG_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Check version
        if: steps.version.outputs.VERSION != steps.version.outputs.TAG_VERSION
        run: exit 1

      - name: Build distributions
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Check packaged assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "nonebot_plugin_mimo_console/py.typed",
              "nonebot_plugin_mimo_console/static/index.html",
              "nonebot_plugin_mimo_console/static/assets/app.js",
              "nonebot_plugin_mimo_console/static/assets/styles.css",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing package assets: {missing}")
          PY

      - name: Test installed wheel
        run: |
          uv venv --seed .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl
          .package-venv/bin/python - <<'PY'
          import nonebot

          nonebot.init(driver="~none")
          plugin = nonebot.load_plugin("nonebot_plugin_mimo_console")
          assert plugin is not None
          assert plugin.metadata is not None
          assert plugin.metadata.type == "application"
          PY
          .package-venv/bin/python - <<'PY'
          import nonebot

          nonebot.init(driver="~fastapi")
          plugin = nonebot.load_plugin("nonebot_plugin_mimo_console")
          assert plugin is not None
          app = nonebot.get_app()
          paths = set(app.openapi()["paths"])
          assert "/mimo-console/api/auth/status" in paths
          assert any(
              getattr(route, "path", "") == "/mimo-console/assets"
              for route in app.routes
          )
          PY

      - name: Ensure GitHub release exists
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}

      - name: Upload release assets
        run: gh release upload --clobber "$TAG_NAME" dist/*.tar.gz dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}

      - name: Publish to PyPI
        run: uv publish

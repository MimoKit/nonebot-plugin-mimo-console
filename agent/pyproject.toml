[project]
name = "mimo-console-agent"
version = "0.1.0a1"
description = "Privilege-separated Docker deployment agent for Mimo Console"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "packaging>=24.0,<27.0",
  "ruamel-yaml>=0.18.0,<0.19.0",
  "starlette>=0.47.0,<2.0.0",
  "tomlkit>=0.13.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
mimo-console-agent = "mimo_console_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mimo_console_agent"
module-root = "src"
